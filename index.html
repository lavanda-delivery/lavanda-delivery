<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lavanda Restoran</title>
<style>
body{font-family:Arial;margin:0;background:#f6f2ed;color:#222}header{background:#6b3fa0;color:#fff;text-align:center;padding:22px}main{max-width:700px;margin:auto;padding:15px}.cat{font-size:20px;font-weight:bold;margin:22px 0 10px}.item,.cart{background:#fff;border-radius:12px;padding:14px;margin:8px 0;box-shadow:0 2px 7px #ddd}.item{display:flex;justify-content:space-between;align-items:center}.item button{background:#6b3fa0;color:#fff;border:0;border-radius:8px;padding:9px}.cart{margin-top:25px}input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:8px}.order{width:100%;background:#25D366;color:#fff;border:0;padding:15px;border-radius:10px;font-size:18px;font-weight:bold}
</style>
</head>
<body>
<header><h1>Lavanda Restoran</h1><div>Şəki • Şəhərdaxili çatdırılma pulsuzdur</div></header>
<main id="menu"></main>
<main><div class="cart"><h2>🛒 Sifarişiniz</h2><div id="cart">Səbət boşdur.</div><h3 id="total">Cəmi: 0.00 AZN</h3><input id="name" placeholder="Adınız"><input id="address" placeholder="Çatdırılma ünvanı"><button class="order" onclick="send()">📲 WhatsApp-da sifariş et</button></div></main>
<script>
const phone="994558886383", p=[
["Pizza","Pizza Marqarita",10],["Pizza","Pizza Qarışıq",14],["Pide","Pide ət ilə",9],["Pide","Pide pendirli",8],
["Dönər","Dönər",5],["Dönər","Dönər set",9],["Kabab","Adana kababı",8],["Kabab","Lülə kabab",8],
["Kabab","Toyuq kababı",7],["Fast Food","Kartof fri",3],["Fast Food","Burger",6],["Fast Food","Nuggets",6],
["Balıq","Balıq porsiyası",12],["Balıq","Balıq seti",16]];
let c={};
function menu(){let cats=[...new Set(p.map(x=>x[0]))];document.querySelector("#menu").innerHTML=cats.map(cat=>'<div class="cat">'+cat+'</div>'+p.map((x,i)=>x[0]==cat?'<div class="item"><span><b>'+x[1]+'</b><br>'+x[2].toFixed(2)+' AZN</span><button onclick="add('+i+')">+ Əlavə et</button></div>':'').join("")).join("")}
function add(i){c[i]=(c[i]||0)+1;cart()}
function cart(){let s="",t=0;Object.keys(c).forEach(i=>{let x=p[i],q=c[i],v=x[2]*q;t+=v;s+=x[1]+" — "+q+" ədəd — "+v.toFixed(2)+" AZN <button onclick='minus("+i+")'>−</button><br>";});document.querySelector("#cart").innerHTML=s||"Səbət boşdur.";document.querySelector("#total").innerText="Cəmi: "+t.toFixed(2)+" AZN"}
function minus(i){if(c[i]>1)c[i]--;else delete c[i];cart()}
function send(){let n=document.querySelector("#name").value.trim(),a=document.querySelector("#address").value.trim(),keys=Object.keys(c);if(!keys.length)return alert("Əvvəlcə məhsul seçin.");if(!n||!a)return alert("Ad və ünvanı yazın.");let t=0,m="Salam, Lavanda Restorandan sifariş vermək istəyirəm.\n\n";keys.forEach(i=>{let x=p[i],q=c[i];t+=x[2]*q;m+=x[1]+" — "+q+" ədəd — "+(x[2]*q).toFixed(2)+" AZN\n"});m+="\nCəmi: "+t.toFixed(2)+" AZN\nAd: "+n+"\nÜnvan: "+a;location.href="https://wa.me/"+phone+"?text="+encodeURIComponent(m)}
menu();cart();
</script>
</body>
</html>
